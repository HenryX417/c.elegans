# Etosha National Park — IM²C 2026
# Reference: https://en.wikipedia.org/wiki/Etosha_National_Park

park_name: Etosha National Park
country: Namibia
continent: Africa

# Geometry
area_km2: 22935
grid_resolution_km: 5.0

# Approximate bounding box (lon/lat for orientation; model uses km grid)
# Park is roughly 120 km N-S × 200 km E-W
bounds:
  x_min_km: 0
  x_max_km: 200
  y_min_km: 0
  y_max_km: 120

# Simplified park outline polygon (km coordinates, convex hull approximation)
# Origin at SW corner of bounding box
park_outline:
  - [10, 10]
  - [190, 10]
  - [195, 30]
  - [198, 60]
  - [195, 90]
  - [185, 110]
  - [150, 115]
  - [100, 118]
  - [50, 115]
  - [15, 100]
  - [8, 70]
  - [5, 40]

# Etosha Pan (large salt flat in the center — low vegetation, high visibility)
pan_polygon:
  - [50, 50]
  - [140, 45]
  - [145, 55]
  - [150, 70]
  - [140, 80]
  - [100, 85]
  - [60, 80]
  - [45, 65]

# Infrastructure
fence_perimeter_km: 850
roads_km: 3551
annual_visitors: 200000

# Main camps / access points (km coordinates)
camps:
  - {name: Okaukuejo, x: 70, y: 55, type: main}
  - {name: Halali, x: 110, y: 65, type: main}
  - {name: Namutoni, x: 160, y: 60, type: main}
  - {name: Onkoshi, x: 145, y: 80, type: secondary}
  - {name: Dolomite, x: 30, y: 75, type: secondary}
  - {name: Lindequist Gate, x: 180, y: 55, type: gate}
  - {name: Anderson Gate, x: 55, y: 25, type: gate}
  - {name: King Nehale Gate, x: 130, y: 105, type: gate}

# Waterholes (approximate km coordinates — 86 total, listing key clusters)
# We generate the rest procedurally around these anchors
waterhole_anchors:
  - {name: Okaukuejo Spring, x: 70, y: 56}
  - {name: Gemsbokvlakte, x: 85, y: 50}
  - {name: Nebrowni, x: 95, y: 52}
  - {name: Chudop, x: 115, y: 60}
  - {name: Klein Namutoni, x: 155, y: 58}
  - {name: Fischer Pan, x: 160, y: 70}
  - {name: Goas, x: 90, y: 45}
  - {name: Charitsaub, x: 75, y: 48}
  - {name: Ombika, x: 60, y: 52}
  - {name: Springbokfontein, x: 40, y: 60}
  - {name: Kalkheuvel, x: 50, y: 45}
  - {name: Adamax, x: 170, y: 55}
waterhole_total: 86
waterhole_seed: 42  # for procedural generation of remaining waterholes

# Road network (simplified as line segments in km coordinates)
# Major tourist routes connecting camps
road_segments:
  - [[55, 25], [70, 55]]        # Anderson Gate to Okaukuejo
  - [[70, 55], [110, 65]]       # Okaukuejo to Halali
  - [[110, 65], [160, 60]]      # Halali to Namutoni
  - [[160, 60], [180, 55]]      # Namutoni to Lindequist Gate
  - [[70, 55], [50, 50]]        # Okaukuejo south loop
  - [[50, 50], [40, 60]]        # West route
  - [[40, 60], [30, 75]]        # To Dolomite
  - [[110, 65], [130, 105]]     # Halali to King Nehale
  - [[160, 60], [145, 80]]      # Namutoni to Onkoshi
  - [[85, 50], [95, 52]]        # Cross-pan route
  - [[70, 55], [85, 50]]        # Okaukuejo east link

# Biome polygons — priority-ordered, first containing polygon wins.
# Cells not matched by any polygon get the default_biome.
biome_polygons:
  - name: salt_pan
    polygon: [[50, 50], [140, 45], [145, 55], [150, 70], [140, 80], [100, 85], [60, 80], [45, 65]]
  - name: woodland
    polygon: [[150, 70], [198, 70], [195, 90], [185, 110], [150, 115]]
  - name: shrubland
    polygon: [[0, 0], [70, 0], [70, 120], [0, 120]]
default_biome: grassland

# Staff
current_rangers: 295

# Species of interest (with conservation weights — higher = more protection priority)
species:
  black_rhino:
    weight: 1.5          # highest priority — endangered, active poaching
    population: 70       # estimated remaining
    habitat_preference:   # terrain affinity (0-1)
      grassland: 0.05
      woodland: 0.95
      salt_pan: 0.0
      shrubland: 0.15
    waterhole_affinity: 0.95   # strongly water-dependent
    seasonal_shift: 0.3        # moderate shift toward water in dry season
  elephant:
    weight: 0.7
    population: 2500
    habitat_preference:
      grassland: 0.4
      woodland: 0.75
      salt_pan: 0.1
      shrubland: 0.2
    waterhole_affinity: 0.95
    seasonal_shift: 0.4
  lion:
    weight: 0.6
    population: 150
    habitat_preference:
      grassland: 0.7
      woodland: 0.45
      salt_pan: 0.1
      shrubland: 0.2
    waterhole_affinity: 0.7
    seasonal_shift: 0.2
  plains_herbivores:
    weight: 0.25
    population: 30000    # zebra, springbok, oryx, kudu combined
    habitat_preference:
      grassland: 0.85
      woodland: 0.25
      salt_pan: 0.15
      shrubland: 0.05
    waterhole_affinity: 0.45
    seasonal_shift: 0.5

# Threat types (with weights — higher = more dangerous)
threats:
  poaching:
    weight: 1.0
    features:
      fence_distance: -0.4     # closer to fence = higher risk (negative = inversely proportional)
      road_distance: -0.2      # closer to roads = easier access for poachers
      camp_distance: 0.3       # farther from camps = less patrol presence
      waterhole_distance: -0.5 # poachers target waterholes where animals gather
      terrain_openness: -0.2   # open terrain makes poaching harder (visible)
      seasonal_dry: 0.3        # dry season concentrates animals = easier targets
  wildfire:
    weight: 0.5
    features:
      fence_distance: 0.0
      road_distance: 0.1       # roads act as firebreaks
      camp_distance: 0.1
      waterhole_distance: 0.2  # drier areas farther from water
      terrain_openness: -0.3   # open grassland burns fast
      seasonal_dry: 0.5        # fires much worse in dry season
  human_wildlife_conflict:
    weight: 0.4
    features:
      fence_distance: -0.7     # conflict at park boundaries
      road_distance: -0.3      # near roads = near people
      camp_distance: -0.4      # near camps
      waterhole_distance: 0.0
      terrain_openness: 0.0
      seasonal_dry: 0.1
  unauthorized_entry:
    weight: 0.3
    features:
      fence_distance: -0.8     # entry at fence
      road_distance: -0.2
      camp_distance: 0.2       # avoid camps
      waterhole_distance: 0.0
      terrain_openness: 0.1
      seasonal_dry: 0.0

# Seasonal parameters
seasons:
  dry:
    months: [5, 6, 7, 8, 9, 10]
    multiplier: 1.3    # overall risk multiplier
  wet:
    months: [11, 12, 1, 2, 3, 4]
    multiplier: 0.8

# Animal density model (used for disruption scoring)
# Relative density scaling: waterholes attract animals, pan is mostly empty
density_waterhole_radius_km: 15
density_waterhole_peak: 3.0     # multiplier at waterhole
density_pan_factor: 0.1         # very low density on pan
density_base: 1.0               # baseline density elsewhere
