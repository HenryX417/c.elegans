# Resource type catalog — shared across parks, with per-park overrides possible

resource_types:
  ranger_foot_team:
    cost_per_unit: 1.0          # normalized cost (ranger-team as base unit)
    coverage_radius_km: 4.5     # effective patrol radius per shift
    detection_alpha:             # effectiveness coefficient per threat type
      poaching: 1.0
      wildfire: 0.3
      human_wildlife_conflict: 0.7
      unauthorized_entry: 0.8
      illegal_logging: 0.5       # can spot logging activity on patrol
    disruption_delta: 0.15       # mild disruption to wildlife
    terrain_modifier:
      grassland: 1.0
      shrubland: 0.85
      woodland: 0.7
      savanna_woodland: 0.8
      salt_pan: 0.7              # hard to walk on
      mopane_woodland: 0.6
      dolomite_hills: 0.5
      forest: 0.4
      rainforest: 0.3
      alpine: 0.5
      wetland: 0.4
    speed_kmh: 4.0               # walking speed for routing
    shift_hours: 8.0

  vehicle_patrol:
    cost_per_unit: 2.5
    coverage_radius_km: 15.0
    detection_alpha:
      poaching: 0.4
      wildfire: 0.3
      human_wildlife_conflict: 0.5
      unauthorized_entry: 0.6
      illegal_logging: 0.4       # road patrols intercept timber trucks
    disruption_delta: 0.35
    terrain_modifier:
      grassland: 1.0
      shrubland: 0.9
      woodland: 0.7
      savanna_woodland: 0.9
      salt_pan: 0.5
      mopane_woodland: 0.7
      dolomite_hills: 0.3
      forest: 0.2
      rainforest: 0.1
      alpine: 0.3
      wetland: 0.1
    speed_kmh: 30.0
    shift_hours: 8.0
    requires_road: true

  fixed_sensor_tower:
    cost_per_unit: 5.0
    coverage_radius_km: 10.0
    detection_alpha:
      poaching: 0.5
      wildfire: 0.7
      human_wildlife_conflict: 0.3
      unauthorized_entry: 0.6
      illegal_logging: 0.3       # visual detection of logging sites
    disruption_delta: 0.02
    terrain_modifier:
      grassland: 1.0
      shrubland: 0.85
      woodland: 0.6
      savanna_woodland: 0.7
      salt_pan: 1.0
      mopane_woodland: 0.5
      dolomite_hills: 0.8
      forest: 0.3
      rainforest: 0.2
      alpine: 0.9
      wetland: 0.5

  drone:
    cost_per_unit: 3.0
    coverage_radius_km: 12.0
    detection_alpha:
      poaching: 0.7
      wildfire: 0.6
      human_wildlife_conflict: 0.3
      unauthorized_entry: 0.7
      illegal_logging: 0.2       # limited by canopy in logging areas
    disruption_delta: 0.10
    terrain_modifier:
      grassland: 1.0
      shrubland: 0.85
      woodland: 0.55
      savanna_woodland: 0.8
      salt_pan: 1.0
      mopane_woodland: 0.6
      dolomite_hills: 0.9
      forest: 0.3
      rainforest: 0.15
      alpine: 0.8
      wetland: 0.7
    flight_hours: 4.0

  camera_trap:
    cost_per_unit: 0.5
    coverage_radius_km: 0.5
    detection_alpha:
      poaching: 0.8
      wildfire: 0.1
      human_wildlife_conflict: 0.2
      unauthorized_entry: 0.8
      illegal_logging: 0.4       # captures loggers on camera
    disruption_delta: 0.01
    terrain_modifier:
      grassland: 0.8
      shrubland: 0.9
      woodland: 0.95
      savanna_woodland: 1.0
      salt_pan: 0.5
      mopane_woodland: 0.9
      dolomite_hills: 0.7
      forest: 0.8
      rainforest: 0.7
      alpine: 0.6
      wetland: 0.5

  aerial_overflight:
    cost_per_unit: 8.0
    coverage_radius_km: 25.0
    detection_alpha:
      poaching: 0.3
      wildfire: 0.8
      human_wildlife_conflict: 0.2
      unauthorized_entry: 0.4
      illegal_logging: 0.5       # good overview of canopy clearings
    disruption_delta: 0.25
    terrain_modifier:
      grassland: 1.0
      shrubland: 0.85
      woodland: 0.55
      savanna_woodland: 0.7
      salt_pan: 1.0
      mopane_woodland: 0.5
      dolomite_hills: 0.8
      forest: 0.3
      rainforest: 0.2
      alpine: 0.9
      wetland: 0.6
    flight_hours: 6.0

  fence_sensor:
    cost_per_unit: 1.5
    coverage_radius_km: 2.0
    detection_alpha:
      poaching: 0.4
      wildfire: 0.0
      human_wildlife_conflict: 0.5
      unauthorized_entry: 0.9
      illegal_logging: 0.3       # detects movement along boundary
    disruption_delta: 0.01
    terrain_modifier:
      grassland: 1.0
      shrubland: 1.0
      woodland: 1.0
      savanna_woodland: 1.0
      salt_pan: 1.0
      mopane_woodland: 1.0
      dolomite_hills: 0.8
      forest: 0.8
      rainforest: 0.7
      alpine: 0.9
      wetland: 0.6
    requires_fence: true

  # --- NEW RESOURCE TYPES ---

  acoustic_sensor:
    cost_per_unit: 1.2
    coverage_radius_km: 3.0      # detects chainsaw / gunshot sounds
    detection_alpha:
      poaching: 0.6              # gunshot detection
      wildfire: 0.1
      human_wildlife_conflict: 0.2
      unauthorized_entry: 0.4
      illegal_logging: 0.8       # chainsaw acoustic signature — primary use case
    disruption_delta: 0.01       # passive, no disruption
    terrain_modifier:
      grassland: 0.7
      shrubland: 0.75
      woodland: 0.85
      savanna_woodland: 0.8
      salt_pan: 0.5              # little sound propagation over open pan
      mopane_woodland: 0.9
      dolomite_hills: 0.6
      forest: 1.0                # forest amplifies acoustic detection
      rainforest: 0.9            # dense vegetation still carries sound
      alpine: 0.5
      wetland: 0.6

  thermal_camera:
    cost_per_unit: 2.0
    coverage_radius_km: 5.0      # thermal imaging range
    detection_alpha:
      poaching: 0.4              # detects human body heat at night
      wildfire: 0.9              # primary use case — early fire detection
      human_wildlife_conflict: 0.3
      unauthorized_entry: 0.5
      illegal_logging: 0.2       # limited use for logging detection
    disruption_delta: 0.02       # passive, minimal disruption
    terrain_modifier:
      grassland: 1.0
      shrubland: 0.9
      woodland: 0.65
      savanna_woodland: 0.8
      salt_pan: 1.0              # excellent thermal contrast
      mopane_woodland: 0.6
      dolomite_hills: 0.7
      forest: 0.4
      rainforest: 0.3
      alpine: 0.9
      wetland: 0.5

  ai_camera_trap:
    cost_per_unit: 1.0
    coverage_radius_km: 0.8      # slightly wider than basic camera trap
    detection_alpha:
      poaching: 1.2              # AI-enhanced: auto-classifies human vs animal, alerts in real-time
      wildfire: 0.15
      human_wildlife_conflict: 0.4
      unauthorized_entry: 1.0
      illegal_logging: 0.6       # recognizes logging equipment/vehicles
    disruption_delta: 0.01       # passive, no disruption
    terrain_modifier:
      grassland: 0.8
      shrubland: 0.9
      woodland: 0.95
      savanna_woodland: 1.0
      salt_pan: 0.5
      mopane_woodland: 0.9
      dolomite_hills: 0.7
      forest: 0.9
      rainforest: 0.8
      alpine: 0.6
      wetland: 0.5

# Coverage kernel: how resource influence spreads to nearby cells
coverage_kernel: gaussian       # options: gaussian, tophat
# For gaussian: influence(d) = exp(-0.5 * (d / radius)^2)
# For tophat: influence(d) = 1.0 if d <= radius else 0.0

# Biome-level effects applied to resource effectiveness and risk
biome_effects:
  grassland:
    patrol_speed_mult: 1.0
    drone_visibility: 1.0
    poaching_concealment: 0.2
    wildfire_susceptibility: 0.7
  shrubland:
    patrol_speed_mult: 0.85
    drone_visibility: 0.8
    poaching_concealment: 0.4
    wildfire_susceptibility: 0.5
  woodland:
    patrol_speed_mult: 0.7
    drone_visibility: 0.5
    poaching_concealment: 0.7
    wildfire_susceptibility: 0.4
  salt_pan:
    patrol_speed_mult: 0.6
    drone_visibility: 1.0
    poaching_concealment: 0.05
    wildfire_susceptibility: 0.0
  forest:
    patrol_speed_mult: 0.5
    drone_visibility: 0.3
    poaching_concealment: 0.8
    wildfire_susceptibility: 0.6
  rainforest:
    patrol_speed_mult: 0.35
    drone_visibility: 0.15
    poaching_concealment: 0.9
    wildfire_susceptibility: 0.2
  alpine:
    patrol_speed_mult: 0.6
    drone_visibility: 0.9
    poaching_concealment: 0.3
    wildfire_susceptibility: 0.3
  wetland:
    patrol_speed_mult: 0.4
    drone_visibility: 0.7
    poaching_concealment: 0.5
    wildfire_susceptibility: 0.1
  dolomite_hills:
    patrol_speed_mult: 0.55
    drone_visibility: 0.8
    poaching_concealment: 0.5
    wildfire_susceptibility: 0.3
