# Resource type catalog — shared across parks, with per-park overrides possible

resource_types:
  ranger_foot_team:
    cost_per_unit: 1.0          # normalized cost (ranger-team as base unit)
    coverage_radius_km: 5.0     # effective patrol radius per shift
    detection_alpha:             # effectiveness coefficient per threat type
      poaching: 0.6
      wildfire: 0.2
      human_wildlife_conflict: 0.4
      unauthorized_entry: 0.5
    disruption_delta: 0.15       # mild disruption to wildlife
    terrain_modifier:
      grassland: 1.0
      savanna_woodland: 0.8
      salt_pan: 0.7              # hard to walk on
      mopane_woodland: 0.6
      dolomite_hills: 0.5
      forest: 0.4
      rainforest: 0.3
      alpine: 0.5
      wetland: 0.4
    speed_kmh: 4.0               # walking speed for routing
    shift_hours: 8.0

  vehicle_patrol:
    cost_per_unit: 2.5
    coverage_radius_km: 15.0
    detection_alpha:
      poaching: 0.4
      wildfire: 0.3
      human_wildlife_conflict: 0.5
      unauthorized_entry: 0.6
    disruption_delta: 0.35
    terrain_modifier:
      grassland: 1.0
      savanna_woodland: 0.9
      salt_pan: 0.5              # limited road access on pan
      mopane_woodland: 0.7
      dolomite_hills: 0.3
      forest: 0.2
      rainforest: 0.1
      alpine: 0.3
      wetland: 0.1
    speed_kmh: 30.0
    shift_hours: 8.0
    requires_road: true          # can only be placed near roads

  fixed_sensor_tower:
    cost_per_unit: 5.0
    coverage_radius_km: 10.0
    detection_alpha:
      poaching: 0.5
      wildfire: 0.7              # early fire detection
      human_wildlife_conflict: 0.3
      unauthorized_entry: 0.6
    disruption_delta: 0.02       # almost no disruption (static)
    terrain_modifier:
      grassland: 1.0
      savanna_woodland: 0.7
      salt_pan: 1.0              # excellent visibility
      mopane_woodland: 0.5
      dolomite_hills: 0.8
      forest: 0.3
      rainforest: 0.2
      alpine: 0.9
      wetland: 0.5

  drone:
    cost_per_unit: 3.0
    coverage_radius_km: 12.0
    detection_alpha:
      poaching: 0.7
      wildfire: 0.6
      human_wildlife_conflict: 0.3
      unauthorized_entry: 0.7
    disruption_delta: 0.10
    terrain_modifier:
      grassland: 1.0
      savanna_woodland: 0.8
      salt_pan: 1.0
      mopane_woodland: 0.6
      dolomite_hills: 0.9
      forest: 0.3                # canopy blocks view
      rainforest: 0.15           # dense canopy, very limited
      alpine: 0.8
      wetland: 0.7
    flight_hours: 4.0            # limited endurance

  camera_trap:
    cost_per_unit: 0.5
    coverage_radius_km: 0.5      # very local
    detection_alpha:
      poaching: 0.8              # excellent at detecting intrusion
      wildfire: 0.1
      human_wildlife_conflict: 0.2
      unauthorized_entry: 0.8
    disruption_delta: 0.01       # passive, no disruption
    terrain_modifier:
      grassland: 0.8
      savanna_woodland: 1.0
      salt_pan: 0.5
      mopane_woodland: 0.9
      dolomite_hills: 0.7
      forest: 0.8
      rainforest: 0.7
      alpine: 0.6
      wetland: 0.5

  aerial_overflight:
    cost_per_unit: 8.0
    coverage_radius_km: 25.0
    detection_alpha:
      poaching: 0.3
      wildfire: 0.8
      human_wildlife_conflict: 0.2
      unauthorized_entry: 0.4
    disruption_delta: 0.25       # noisy
    terrain_modifier:
      grassland: 1.0
      savanna_woodland: 0.7
      salt_pan: 1.0
      mopane_woodland: 0.5
      dolomite_hills: 0.8
      forest: 0.3
      rainforest: 0.2
      alpine: 0.9
      wetland: 0.6
    flight_hours: 6.0

  fence_sensor:
    cost_per_unit: 1.5
    coverage_radius_km: 2.0      # only effective near fence
    detection_alpha:
      poaching: 0.4
      wildfire: 0.0
      human_wildlife_conflict: 0.5
      unauthorized_entry: 0.9
    disruption_delta: 0.01
    terrain_modifier:
      grassland: 1.0
      savanna_woodland: 1.0
      salt_pan: 1.0
      mopane_woodland: 1.0
      dolomite_hills: 0.8
      forest: 0.8
      rainforest: 0.7
      alpine: 0.9
      wetland: 0.6
    requires_fence: true         # can only be placed near fence

# Coverage kernel: how resource influence spreads to nearby cells
coverage_kernel: gaussian       # options: gaussian, tophat
# For gaussian: influence(d) = exp(-0.5 * (d / radius)^2)
# For tophat: influence(d) = 1.0 if d <= radius else 0.0
